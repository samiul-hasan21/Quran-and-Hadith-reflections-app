services:
  - type: web
    name: quran-hadith-reflections
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
